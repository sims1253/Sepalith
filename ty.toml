[environment]
python-version = "3.10"
extra-paths = ["packages/sepalith/src", "packages/sepalith/tests"]

[src]
include = ["packages/sepalith"]

[rules]
# Keep ty's default correctness rules, and fail on these optional escape hatches.
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
blanket-ignore-comment = "error"


[analysis]
# The training runtime imports these; the quality environment does not install them.
allowed-unresolved-imports = ["torch", "torch.**", "transformers", "transformers.**", "trl", "trl.**", "unsloth", "unsloth.**", "datasets", "datasets.**", "safetensors", "safetensors.**", "numpy", "numpy.**"]

# Frozen campaign modules and packet tests ported with import-only changes
# (training/PROVENANCE.json). They are dynamically typed, so each override lists only
# the inference rules that file trips as ported. New training modules get every rule.

[[overrides]]
include = ["packages/sepalith/src/sepalith/campaign_protocol.py"]

[overrides.rules]
invalid-return-type = "ignore"

[[overrides]]
include = ["packages/sepalith/src/sepalith/campaign_selection.py"]

[overrides.rules]
invalid-return-type = "ignore"

[[overrides]]
